name: Tests

on:
  push:
    branches: [main, "release-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest yt-dlp pyflakes
      - run: python -m pyflakes anydl.py build.py tests
      - run: python -m pytest tests -q
